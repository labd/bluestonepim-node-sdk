name: validate

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Format
        id: format
        if: ${{ !cancelled() }}
        run: pnpm format

      - name: Knip
        id: knip
        if: ${{ !cancelled() }}
        run: pnpm lint:knip

      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          KNIP: ${{ steps.knip.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ Pass" ;;
              failure) echo "❌ Fail" ;;
              skipped) echo "⏭️ Skip" ;;
              *)       echo "❔ $1" ;;
            esac
          }
          {
            echo "## Lint"
            echo ""
            echo "| Check  | Result  |"
            echo "| ------ | ------- |"
            echo "| Lint   | $(icon "$LINT") |"
            echo "| Format | $(icon "$FORMAT") |"
            echo "| Knip   | $(icon "$KNIP") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate on Node ${{ matrix.node }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ Pass" ;;
              failure) echo "❌ Fail" ;;
              skipped) echo "⏭️ Skip" ;;
              *)       echo "❔ $1" ;;
            esac
          }
          {
            echo "## Validate (Node ${{ matrix.node }})"
            echo ""
            echo "| Check     | Result  |"
            echo "| --------- | ------- |"
            echo "| Typecheck | $(icon "$TYPECHECK") |"
            echo "| Test      | $(icon "$TEST") |"
            echo "| Build     | $(icon "$BUILD") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, validate]
    permissions:
      contents: write # push version-bump commit + tag, create GitHub Release
      issues: write # post comments on issues referenced in changelog
      pull-requests: write # create/update the "Version Packages" PR
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Create and publish versions
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "Release new version"
          commit-message: "update version"
          publish-script: pnpm publish:ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
